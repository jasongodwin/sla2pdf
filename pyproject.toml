[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sla2pdf"
version = "0.1.0"
description = "Render Scribus .sla templates to PDF without running Scribus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fpdf2>=2.7.8",
  "uharfbuzz>=0.53",
  "Pillow>=10.2",
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sla2pdf = "sla2pdf.__main__:main"

[tool.setuptools]
packages = ["sla2pdf"]
